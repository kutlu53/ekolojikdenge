<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bir Can’ın Gözünden Dünya - Oyun</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hud">
        <!-- Yıl yolculuğu: her mevsimde 5 karar -->
        <div class="journey" aria-label="Yıl ilerlemesi">
            <div class="season-marker" data-season="İlkbahar">
                <span class="marker-ico" data-ico="ilkbahar"></span>
                <span>İlkbahar</span>
                <span class="pips"></span>
            </div>
            <div class="season-marker" data-season="Yaz">
                <span class="marker-ico" data-ico="yaz"></span>
                <span>Yaz</span>
                <span class="pips"></span>
            </div>
            <div class="season-marker" data-season="Sonbahar">
                <span class="marker-ico" data-ico="sonbahar"></span>
                <span>Sonbahar</span>
                <span class="pips"></span>
            </div>
            <div class="season-marker" data-season="Kış">
                <span class="marker-ico" data-ico="kis"></span>
                <span>Kış</span>
                <span class="pips"></span>
            </div>
        </div>

        <!-- Göstergeler -->
        <div class="panel">
            <div class="panel-item" data-key="biyo" data-level="0">
                <span class="panel-ico" data-ico="biyo"></span>
                <span class="panel-label">Canlı Çeşitliliği</span>
                <div class="panel-meter">
                    <div class="stars-container" id="biyo-stars"></div>
                    <span class="panel-value" id="biyo">Mükemmel</span>
                </div>
            </div>
            <div class="panel-item" data-key="su" data-level="0">
                <span class="panel-ico" data-ico="su"></span>
                <span class="panel-label">Su Dengesi</span>
                <div class="panel-meter">
                    <div class="stars-container" id="su-stars"></div>
                    <span class="panel-value" id="su">Mükemmel</span>
                </div>
            </div>
            <div class="panel-item" data-key="toprak" data-level="0">
                <span class="panel-ico" data-ico="toprak"></span>
                <span class="panel-label">Toprak Sağlığı</span>
                <div class="panel-meter">
                    <div class="stars-container" id="toprak-stars"></div>
                    <span class="panel-value" id="toprak">Mükemmel</span>
                </div>
            </div>
            <div class="panel-item" data-key="hava" data-level="0">
                <span class="panel-ico" data-ico="hava"></span>
                <span class="panel-label">Hava/İklim</span>
                <div class="panel-meter">
                    <div class="stars-container" id="hava-stars"></div>
                    <span class="panel-value" id="hava">Mükemmel</span>
                </div>
            </div>
            <div class="panel-item" data-key="insan" data-level="0">
                <span class="panel-ico" data-ico="insan"></span>
                <span class="panel-label">İnsan Mutluluğu</span>
                <div class="panel-meter">
                    <div class="stars-container" id="insan-stars"></div>
                    <span class="panel-value" id="insan">Mükemmel</span>
                </div>
            </div>
        </div>
    </header>

    <main class="game-main">
        <div class="stage">
            <div class="actor" id="actor">
                <div id="uiRole"><span id="roleIcon"></span></div>
                <div class="actor-name" id="roleText"></div>
                <div class="can" id="uiCan"></div>
            </div>
            <div class="bubble">
                <div id="uiSeason"></div>
                <div id="sceneText"></div>
                <div id="uiObservation"></div>
            </div>
        </div>
        <div id="choices"></div>
    </main>

    <nav class="tools">
        <button class="tool-btn achievements-btn" id="achievementsBtn" title="Başarı Rozetleri" aria-label="Başarı Rozetleri" data-ico="trophy"></button>
        <button class="tool-btn history-btn" id="historyBtn" title="Karar Geçmişi" aria-label="Karar Geçmişi" data-ico="history"></button>
        <button class="tool-btn audio-toggle" id="audioToggle" title="Ses Aç/Kapat" aria-label="Ses Aç/Kapat" data-ico="sound"></button>
        <button class="tool-btn restart-btn" id="restartBtn" title="Yeniden Başla" aria-label="Yeniden Başla" data-ico="restart"></button>
    </nav>

    <!-- Karar Geçmişi Modal -->
    <div class="history-modal" id="historyModal">
        <div class="history-content">
            <h2>📜 Karar Geçmişi</h2>
            <div id="historyList"></div>
            <button class="modal-close" data-close="historyModal">Kapat</button>
        </div>
    </div>

    <!-- Başarı Rozetleri Modal -->
    <div class="history-modal" id="achievementsModal">
        <div class="history-content">
            <h2>🏆 Başarı Rozetleri</h2>
            <div id="achievementsList"></div>
            <button class="modal-close" data-close="achievementsModal">Kapat</button>
        </div>
    </div>

    <script src="js/art.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/history.js"></script>
    <script src="js/tooltips.js"></script>
    <script src="js/minigames.js"></script>
    <script src="js/season-animations.js"></script>
    <script src="js/magical-effects.js"></script>
    <script src="js/ui.js"></script>
    <script>
      // Oyun başlatma
      window.addEventListener('DOMContentLoaded', function() {
        if (window.GameArt) {
          GameArt.mount();
        }

        if (window.GameEngine && window.GameUI) {
          GameEngine.init();
          GameEngine.subscribe((state) => {
            const scene = GameEngine.getScene(state.currentSceneId);
            GameUI.render(state, scene);
          });
          // İlk sahneyi göster
          const state = GameEngine.getState();
          const scene = GameEngine.getScene(state.currentSceneId);
          GameUI.render(state, scene);

          // Masalsı efektleri başlat
          if (window.MagicalEffects) {
            window.MagicalEffects.init();
          }

          // Yeniden başlat butonu
          const restartBtn = document.getElementById('restartBtn');
          if (restartBtn) {
            restartBtn.onclick = function() {
              GameEngine.restart();
            };
          }

          // Ses kontrol butonu
          const audioToggle = document.getElementById('audioToggle');
          if (audioToggle && window.AudioManager) {
            audioToggle.onclick = function() {
              const enabled = window.AudioManager.toggleAudio();
              audioToggle.innerHTML = GameArt.icon(enabled ? 'sound' : 'mute');
              audioToggle.classList.toggle('muted', !enabled);
            };
          }

          // Pencereleri kapatma: "Kapat" butonu veya dışarı tıklama
          document.querySelectorAll('.history-modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
              if (e.target === modal || e.target.hasAttribute('data-close')) {
                modal.classList.remove('show');
              }
            });
          });

          // Karar geçmişi butonu
          const historyBtn = document.getElementById('historyBtn');
          const historyModal = document.getElementById('historyModal');
          if (historyBtn && historyModal) {
            historyBtn.onclick = function() {
              const history = window.DecisionHistory ? window.DecisionHistory.get() : [];
              const list = document.getElementById('historyList');
              if (list) {
                if (history.length === 0) {
                  list.innerHTML = '<p class="modal-empty">Henüz karar verilmedi.</p>';
                } else {
                  list.innerHTML = history.slice().reverse().map(decision => `
                    <div class="history-item">
                      <div class="history-season">${decision.season || 'Bilinmeyen'}</div>
                      <div class="history-text">${(decision.sceneText || '').substring(0, 100)}${(decision.sceneText || '').length > 100 ? '...' : ''}</div>
                      <div class="history-choice">${decision.choice ? decision.choice.label : 'Seçim yapılmadı'}</div>
                    </div>
                  `).join('');
                }
              }
              historyModal.classList.add('show');
            };
          }

          // Başarı rozetleri butonu
          const achievementsBtn = document.getElementById('achievementsBtn');
          const achievementsModal = document.getElementById('achievementsModal');
          if (achievementsBtn && achievementsModal) {
            achievementsBtn.onclick = function() {
              const achievements = window.AchievementSystem ? window.AchievementSystem.getAll() : [];
              const list = document.getElementById('achievementsList');
              if (list) {
                if (achievements.length === 0) {
                  list.innerHTML = '<p class="modal-empty">Henüz başarı rozeti yok.</p>';
                } else {
                  list.innerHTML = achievements.map(ach => `
                    <div class="history-item ${ach.earned ? '' : 'locked'}">
                      <div class="badge-row">
                        <span class="badge-icon">${ach.icon || '🏆'}</span>
                        <div>
                          <div class="badge-name">${ach.name || 'Başarı'}</div>
                          <div class="badge-desc">${ach.description || ''}</div>
                          <div class="badge-state">${ach.earned ? '✓ Kazanıldı' : 'Henüz kazanılmadı'}</div>
                        </div>
                      </div>
                    </div>
                  `).join('');
                }
              }
              achievementsModal.classList.add('show');
            };
          }
        }
      });
    </script>
  </body>
</html>
